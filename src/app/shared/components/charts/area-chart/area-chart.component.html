<app-chart-card
  [titleAr]="titleAr"
  (exportPng)="onExportPng()"
  (exportSvg)="onExportSvg()">

  @if (loading()) {
    <app-chart-loading-skeleton />
  } @else if (isEmpty) {
    <app-chart-empty-state />
  } @else {
    <div class="area-chart__canvas-wrapper">
      <canvas #chartCanvas role="img" [attr.aria-label]="'رسم بياني: ' + titleAr">
        <p class="sr-only">رسم بياني يعرض {{ titleAr }}</p>
      </canvas>
    </div>
  }

</app-chart-card>
