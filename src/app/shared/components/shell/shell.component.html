<div class="shell-container">
  <app-storage-warning></app-storage-warning>
  <app-header (sidebarToggle)="toggleSidebar()"></app-header>

  <div class="main-layout">
    <app-sidebar [isOpen]="isSidebarOpen()" [routes]="navigation"></app-sidebar>

    <!-- Overlay for mobile sidebar -->
    @if (isSidebarOpen()) {
      <div class="sidebar-overlay" (click)="closeSidebar()" aria-hidden="true"></div>
    }

    <main class="content-area" [@routeAnimations]="outlet.isActivated ? outlet.activatedRoute : ''">
      <router-outlet #outlet="outlet"></router-outlet>
    </main>
    <app-toast></app-toast>
  </div>
</div>
