<div class="dashboard-container">
  <div class="dashboard-header">
    <h2>لوحة التحكم</h2>
    <app-date-range-selector></app-date-range-selector>
  </div>

  <div class="dashboard-grid" cdkDropList (cdkDropListDropped)="onDrop($event)">
    @for (card of cards(); track card.id) {
      <div class="dashboard-grid-item" cdkDrag>
        @if (card.visible) {
          <app-dashboard-card-shell
            [titleAr]="card.titleAr"
            [componentType]="card.component"
            (hideCard)="onHideCard(card.id)"
          ></app-dashboard-card-shell>
        } @else {
          <app-dashboard-card-placeholder
            [titleAr]="card.titleAr"
            (showCard)="onShowCard(card.id)"
          ></app-dashboard-card-placeholder>
        }
      </div>
    }
  </div>
</div>
