<div class="chart-card">
  <div class="chart-header">
    <h3 class="chart-title">أعلى المحفزات ارتباطاً بالرغبة الشديدة</h3>
  </div>

  <div class="list-container" *ngIf="byTrigger.length > 0; else emptyState">
    <div class="list-row" *ngFor="let item of byTrigger; let i = index">
      
      <div class="rank-badge">{{ i + 1 }}</div>

      <div class="keyword-info">
        <span class="keyword">{{ item.keyword }}</span>
        <span class="limited-sample-badge" *ngIf="item.isLimitedSample">عينة محدودة</span>
      </div>

      <div class="stats-area">
        <div class="stat-group">
          <span class="stat-label">المتوسط:</span>
          <span class="stat-value avg">{{ item.avgUrge }}</span>
        </div>
        <div class="stat-group">
          <span class="stat-label">التكرار:</span>
          <span class="stat-value count">{{ item.count }}</span>
        </div>
      </div>

    </div>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      لا تتوفر بيانات المحفزات للفترة المحددة
    </div>
  </ng-template>
</div>
