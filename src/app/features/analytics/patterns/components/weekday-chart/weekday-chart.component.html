<div class="weekday-chart-container" [attr.dir]="'rtl'">
  <h3 class="chart-title">توزيع أيام الأسبوع</h3>
  
  <div class="chart-content">
    @if (status === 'data' && weekdays.length > 0) {
      <div class="bars-container">
        @for (day of weekdays; track day.weekday) {
          <div class="bar-group" [class.is-peak]="day.isPeak">
            <div class="bar-track">
              <div class="bar-fill" [style.height.%]="day.percentage">
                <span class="bar-tooltip">{{ day.count }} مرة ({{ day.percentage }}%)</span>
              </div>
            </div>
            <span class="day-label">{{ day.labelAr }}</span>
          </div>
        }
      </div>
    } @else {
      <div class="empty-placeholder">
        <span>لا توجد بيانات للعرض</span>
      </div>
    }
  </div>
</div>
